name: 生成未签名 IPA（iOS 15 · 单文件版）

# 手机操作专用：仓库里只需要这一个文件，其余 3 个工程文件会在运行时自动还原。
# 下方那 3 行很长的字符串是工程文件的 base64 编码，避免在网页粘贴时格式错乱。
# 不需要你看懂，也不要改动它们。
#
# 全程免费：免费 GitHub 账号 + Public 仓库的 macOS 标准 runner（免费且不限量）。
# 不需要 Apple 开发者账号、证书、Secrets，也不需要 Mac。
# 产出的是未签名 IPA（编译产物，不能直接装到非越狱设备）。

on:
  workflow_dispatch:

jobs:
  build:
    # macOS 14 镜像已于 2026-11-02 退役；macos-15 默认 Xcode 16.4，支持 iOS 15 部署目标。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 锁定 Xcode 16.4 并打印版本
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          else
            echo "镜像里没有 Xcode 16.4，改用镜像默认 Xcode"
          fi
          xcodebuild -version

      - name: 还原 3 个工程文件
        run: |
          set -euo pipefail
          mkdir -p HabitTrackerDemo
          echo '' | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > 'HabitTrackerDemo/HabitTrackerDemoApp.swift'
          echo '' | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > 'HabitTrackerDemo/Info.plist'
          echo '' | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > 'project.yml'
          wc -l HabitTrackerDemo/HabitTrackerDemoApp.swift HabitTrackerDemo/Info.plist project.yml

      - name: 安装 XcodeGen（开源免费）
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译未签名 archive（真机 SDK）
        run: |
          set -euo pipefail
          xcodebuild \
            -project HabitTrackerDemo.xcodeproj \
            -scheme HabitTrackerDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HabitTrackerDemo.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean archive

      - name: 打包成未签名 .ipa
        run: |
          set -euo pipefail
          APP=$(find build/HabitTrackerDemo.xcarchive/Products/Applications \
                -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          echo "找到 App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HabitTrackerDemo-unsigned.ipa Payload
          rm -rf Payload
          ls -lh HabitTrackerDemo-unsigned.ipa

      - name: 验证产物确实未签名
        run: |
          APP=$(find build/HabitTrackerDemo.xcarchive/Products/Applications \
                -maxdepth 1 -name '*.app' -type d -print -quit)
          # 预期输出：code object is not signed at all
          codesign -dv "$APP" 2>&1 || true
          unzip -l HabitTrackerDemo-unsigned.ipa | head -n 12

      - name: 上传 IPA 为 artifact（免费）
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrackerDemo-unsigned-ipa
          path: HabitTrackerDemo-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
